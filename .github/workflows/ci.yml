name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run art:check
      - name: Inspect environment composition and negative controls
        run: npm run quality:environment:check
      - name: Audit every runtime actor animation bank
        run: npm run art:animation:check
      - name: Rebuild mobile selection sprites byte-for-byte
        run: npm run art:selection:check
      - name: Verify generation ingress and deterministic actor builds
        run: npm run art:generation:check
      - name: Calibrate generated actor candidate cuts and motion
        run: npm run art:candidate:check
      - name: Reject unsafe production-actor presentation transforms
        run: npm run art:presentation:audit
      - name: Audit rejected isolated Ashfang idle-pose master
        run: npm run art:pose:audit
      - run: npm test
      - run: npm run test:e2e
      - name: Build candidate screen gallery
        run: npm run report:screens
      - name: Capture temporal quality matrix
        run: npm run capture:matrix
      - name: Build public quality index
        run: npm run report:quality
      - name: Upload Playwright report
        if: ${{ always() && hashFiles('playwright-report/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
      - name: Upload test results
        if: ${{ always() && hashFiles('test-results/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
      - name: Upload public quality sequences
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: quality-sequences
          path: quality-results/sequences/
          if-no-files-found: error
      - name: Upload candidate screen gallery
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: quality-screens
          path: quality-results/screens/
          if-no-files-found: error
      - name: Upload generation-pipeline evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: generation-pipeline
          path: quality-results/generation-pipeline/
          if-no-files-found: error
      - name: Upload actor-animation evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: actor-atlas-audit
          path: quality-results/actor-atlas-audit/
          if-no-files-found: error
      - name: Upload environment-composition evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: environment-composition
          path: quality-results/environment-composition/
          if-no-files-found: error
      - name: Upload actor-candidate calibration evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: actor-candidate-calibration
          path: quality-results/actor-candidate-calibration/
          if-no-files-found: error
      - name: Upload actor-presentation evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: actor-presentation
          path: quality-results/actor-presentation/
          if-no-files-found: error
      - name: Upload actor-pose audit evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: actor-pose
          path: quality-results/actor-pose/
          if-no-files-found: error
      - name: Upload public quality index
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: quality-index
          path: quality-results/quality-index/
          if-no-files-found: error

  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build readable production game
        env:
          VITE_BASE_PATH: /cinderwake/
        run: npm run build
      - run: mkdir -p site
      - run: cp -R dist/. site/
      - name: Download Playwright report
        uses: actions/download-artifact@v8
        with:
          name: playwright-report
          path: site/quality/playwright
      - name: Download frame-sequence reports
        uses: actions/download-artifact@v8
        with:
          name: quality-sequences
          path: site/quality/sequences
      - name: Download candidate screen gallery
        uses: actions/download-artifact@v8
        with:
          name: quality-screens
          path: site/quality/screens
      - name: Download generation-pipeline evidence
        uses: actions/download-artifact@v8
        with:
          name: generation-pipeline
          path: site/quality/generation-pipeline
      - name: Download actor-animation evidence
        uses: actions/download-artifact@v8
        with:
          name: actor-atlas-audit
          path: site/quality/actor-atlas-audit
      - name: Download environment-composition evidence
        uses: actions/download-artifact@v8
        with:
          name: environment-composition
          path: site/quality/environment-composition
      - name: Download actor-candidate calibration evidence
        uses: actions/download-artifact@v8
        with:
          name: actor-candidate-calibration
          path: site/quality/actor-candidate-calibration
      - name: Download actor-presentation evidence
        uses: actions/download-artifact@v8
        with:
          name: actor-presentation
          path: site/quality/actor-presentation
      - name: Download actor-pose audit evidence
        uses: actions/download-artifact@v8
        with:
          name: actor-pose
          path: site/quality/actor-pose
      - name: Download public quality index
        uses: actions/download-artifact@v8
        with:
          name: quality-index
          path: site/quality
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
