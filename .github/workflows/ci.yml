name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run art:check
      - name: Rebuild mobile selection sprites byte-for-byte
        run: npm run art:selection:check
      - name: Verify generation ingress and deterministic actor builds
        run: npm run art:generation:check
      - run: npm test
      - run: npm run test:e2e
      - name: Capture temporal quality matrix
        run: npm run capture:matrix
      - name: Upload Playwright report
        if: ${{ always() && hashFiles('playwright-report/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
      - name: Upload test results
        if: ${{ always() && hashFiles('test-results/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
      - name: Upload public quality sequences
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: quality-sequences
          path: quality-results/sequences/
          if-no-files-found: error
      - name: Upload generation-pipeline evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: generation-pipeline
          path: quality-results/generation-pipeline/
          if-no-files-found: error

  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build readable production game
        env:
          VITE_BASE_PATH: /cinderwake/
        run: npm run build
      - run: mkdir -p site
      - run: cp -R dist/. site/
      - name: Download Playwright report
        uses: actions/download-artifact@v8
        with:
          name: playwright-report
          path: site/quality/playwright
      - name: Download frame-sequence reports
        uses: actions/download-artifact@v8
        with:
          name: quality-sequences
          path: site/quality/sequences
      - name: Download generation-pipeline evidence
        uses: actions/download-artifact@v8
        with:
          name: generation-pipeline
          path: site/quality/generation-pipeline
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
